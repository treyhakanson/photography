<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edinburgh &amp; London 2026</title>
<style>
:root {
  --gap: 0.3rem;
  --pad: 0.3rem;
  --sb: 16px;  /* scrollbar allowance; only nudges row height, never packing */
  /* Placeholder behind every not-yet-loaded photo. Grid spans size the tiles
     independently of the images, so the full layout is drawn in this colour
     before a single byte of image data arrives. Kept near the page black so a
     half-loaded grid doesn't read as a checkerboard. */
  --tile: #1a1a1e;
  color-scheme: light dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: var(--pad);
  background: #111;
  color: #eee;
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header { padding: 0.75rem 0.4rem 1.25rem; }
.Backlink {
  display: inline-block;
  margin-bottom: 0.6rem;
  color: #8b8b96;
  font-size: 0.8rem;
  text-decoration: none;
  transition: color 0.15s;
}
.Backlink:hover, .Backlink:focus-visible { color: #ededf2; }
.Backlink span { margin-right: 0.15rem; }
h1 { margin: 0 0 0.25rem; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.01em; }
header p { margin: 0; color: #8b8b8b; font-size: 0.8rem; }

.gridContainer {
  display: grid;
  /* Square cells: row height tracks the computed column width. */
  grid-auto-rows: calc(
    (100vw - var(--sb) - 2 * var(--pad) - (var(--n) - 1) * var(--gap)) / var(--n)
  );
  grid-auto-flow: dense;
  grid-gap: var(--gap);
}

.Image { margin: 0; overflow: hidden; background: var(--tile); border-radius: 2px; }
.Image img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.s-3-3 { grid-column-end: span 3; grid-row-end: span 3; }
.s-3-4 { grid-column-end: span 3; grid-row-end: span 4; }
.s-3-5 { grid-column-end: span 3; grid-row-end: span 5; }
.s-4-3 { grid-column-end: span 4; grid-row-end: span 3; }
.s-5-3 { grid-column-end: span 5; grid-row-end: span 3; }

:root { --n: 12; }
.gridContainer { grid-template-columns: repeat(12, 1fr); }
@media (max-width: 1079px) {
  :root { --n: 9; }
  .gridContainer { grid-template-columns: repeat(9, 1fr); }
}
@media (max-width: 719px) {
  :root { --n: 6; }
  .gridContainer { grid-template-columns: repeat(6, 1fr); }
  .s-4-3 { grid-column-end: span 3; grid-row-end: span 2; }
  .s-5-3 { grid-column-end: span 6; grid-row-end: span 4; }
}

.Section + .Section { margin-top: 2rem; }
.Footer {
  max-width: 70rem;
  margin: 3rem 0 0;
  padding: 1.4rem 0.4rem 0.6rem;
  border-top: 1px solid #22222a;
  color: #6e6e7a;
  font-size: 0.78rem;
  line-height: 1.7;
}
.Footer-terms { display: block; color: #55555f; }

.Section-body { margin: 0; }
.Section-title {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin: 0 0 0.5rem;
  padding: 0.15rem 0.4rem;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #9a9aa6;
  cursor: pointer;
  user-select: none;
  list-style: none;              /* Firefox default marker */
}
.Section-title::-webkit-details-marker { display: none; }
.Section-title:hover { color: #c8c8d2; }
.Section-title:focus-visible { outline: 2px solid #7aa2f7; outline-offset: 2px; }
.Section-title::before {
  content: "";
  flex: none;
  width: 0.36rem;
  height: 0.36rem;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg);     /* collapsed: points right */
  transition: transform 0.18s ease;
}
.Section-body[open] > .Section-title::before {
  transform: rotate(45deg);      /* expanded: points down */
}
@media (prefers-reduced-motion: reduce) {
  .Section-title::before { transition: none; }
}
.Section-count {
  margin-left: 0.5rem;
  font-weight: 400;
  letter-spacing: 0.08em;
  color: #61616c;
}

.Image { cursor: pointer; }
.Image:focus-visible { outline: 2px solid #7aa2f7; outline-offset: 2px; }
/* Reserve the gutter so locking scroll can't shift the grid mid-transition. */
html { scrollbar-gutter: stable; }
body.is-locked { overflow: hidden; }

.Lightbox {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(1rem, 4vw, 3rem);
}
.Lightbox[hidden] { display: none; }

/* Only this fades. The photo itself stays fully opaque the whole way, so it
   never dips toward the backdrop colour mid-flight. */
.Lightbox-veil {
  position: absolute;
  inset: 0;
  background: rgba(8, 8, 10, 0.95);
}

.Lightbox-close {
  position: absolute;
  top: 0.85rem;
  right: 0.95rem;
  z-index: 2;
  display: grid;
  place-items: center;
  width: 2.25rem;
  height: 2.25rem;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #fff;
  opacity: 0.35;
  cursor: pointer;
  transition: opacity 0.2s, background 0.2s;
}
.Lightbox-close:hover,
.Lightbox-close:focus-visible { opacity: 0.95; background: rgba(255,255,255,0.1); }

/* Two nested transforms, kept apart: the wrapper flies between the tile and
   the centre (FLIP), the card owns the flip. It also holds the perspective,
   since that only applies to a direct child. */
.CardWrap {
  position: relative;
  z-index: 1;
  max-width: 100%;
  max-height: 100%;
  perspective: 1800px;
  will-change: transform;
}
/* Clip only while flying, so the crop morph works without the flip having to
   live inside an overflow container at rest. */
.CardWrap.is-flying { overflow: hidden; }
.Card {
  position: relative;
  max-width: 100%;
  max-height: 100%;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.3, 1);
}
.Card.is-flipped { transform: rotateY(180deg); }
/* While closing, un-flip at the closing speed so both land together. */
.Card.is-closing { transition-duration: 300ms; }

.Face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.Face--front img {
  display: block;
  width: auto;
  height: auto;
  max-width: min(92vw, 1500px);
  max-height: 84vh;
  background: var(--tile);
  border-radius: 3px;
}
.Face--back {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  padding: clamp(1.1rem, 4vw, 2.75rem);
  overflow: auto;
  transform: rotateY(180deg);
  background: #e7e7ea;
  border: 1px solid #cfcfd5;
  border-radius: 3px;
}
.Back-kind {
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #5f5f6b;
}
.Back-title {
  margin: 0;
  font-size: 1.15rem;
  font-weight: 600;
  color: #1a1a1f;
}
.Back-text {
  margin: 0;
  max-width: 62ch;
  font-size: 0.98rem;
  line-height: 1.75;
  color: #303038;
  white-space: pre-wrap;
}
.Back-text.is-empty { color: #63636f; font-style: italic; }
.Back-text a {
  color: inherit;
  text-decoration: underline;
  text-decoration-color: #000;
  text-underline-offset: 2px;
}
.Back-text a:hover { text-decoration-thickness: 2px; }
.Back-text a:focus-visible { outline: 2px solid #000; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .Card { transition: none; }
}

</style>

(electro)magnetic](https://en.wikipedia.org/wiki/A_Dynamical_Theory_of_the_Electromagnetic_Field) personality."}, "swag": {"title": "James Braidwood", "caption": "Allegedly, James Braidwood was the creator of the world's first municipal Fire Department."}}, "elem": {"cannons": {"title": "Tower of London Battlement Sign", "caption": "Taken near the entrance of a tower along the battlements surrounding the property."}, "castle": {"title": "Edinburgh Coat of Arms", "caption": "I believe this is the Edinburgh Coat of Arms, engraved on an old police box. None of the police boxes in Edinburgh are actually in use by the force these days, with most being leased to micro cafes and such. This one had seen better days, and didn't seem to see any use.", "favorite": true}, "crest": {"title": "Scottish Achievement", "caption": "Scottish coat of arms with heraldic achievement, at Castle Edinburgh."}, "crunch": {"title": "Bronze 24-Pounder Cannon Heraldry", "caption": "Likely a depiction of Satan, being consumed by 2 dragons. Ouch."}, "dog": {"title": "Bronze 24-Pounder Cannon Maltese Quoin", "caption": "The quoin used to support the barrel of this cannon is in the shape of a Maltese dog, a nod to its commissioners: the Order of St John (otherwise known as the Order of Malta)."}, "dragon": {"title": "Westminster Abbey Dragon", "caption": "Likely depicts the dragon St. George is fabled to have slain."}, "fence": {"title": "Fence [1]", "caption": "Note much to say here, but I liked the ironwork."}, "grate": {"title": "Bloody Mackenzie's Mausoleum", "caption": "I didn't know what I was photographing until later, but this is a grate on the doors to one of the most famous graves in Greyfriar's Kirkyard: [Bloody Mackenzie's](https://en.wikipedia.org/wiki/George_Mackenzie_of_Rosehaugh) Mausoleum. He was a Scottish lawyer and prominent figure of the [Covenanters](https://en.wikipedia.org/wiki/Covenanters) that earned the name by being one of the its ruthless prosecutors."}, "pulpit": {"title": "Preaching Tent", "caption": "A preaching tent at the National Museum of Scotland. I liked the way the lighting was setup in the exhibit, and the texture of the wood. Outdoor services were particular popular in Scotland following the [Disruption of 1843](https://en.wikipedia.org/wiki/Disruption_of_1843), where ministers across the country broke away from the Church of Scotland. The Scots certainly were (are?) quite a cantankerous bunch."}, "swords": {"title": "Fence [2]", "caption": "Another fence with some nice ironwork, this one featuring some sort of stylized fleur-de-lis points."}, "unicorn": {"title": "Unicorn Relief at the King's Gallery", "caption": "Found on the door to the King's Gallery at the Palace of Holyroodhouse. Positioned across from the British Lion, the much less interesting National mascot of the UK countries.", "favorite": true}, "wheel": {"title": "Bronze 24-Pounder Cannon Wheel", "caption": "Surely the cost of these wheels would have made even [Tim Cook blush](https://www.youtube.com/watch?v=mBHY_Qaw5AI)."}}, "glass": {"apostles": {"title": "The Holy Ghost", "caption": "Likely a depiction of [Acts 2:4](https://www.biblegateway.com/verse/en/Acts%202%3A4), where a group was filled with the Holy Spirit and began to speak in tongues."}, "demure": {"title": "Stained Glass", "caption": "I don't remember exactly where this was; maybe somewhere in St John's Chapel? Definitely somewhere at the Tower of London."}, "flood": {"title": "The Flood", "caption": "I'm not certain what is being depicted here, but there's definitely a religious figure guiding (or punishing?) a group of sailors. Some of the stained glass in Westminster Abbey is actually [quite modern](https://www.westminster-abbey.org/history/explore-our-history/stained-glass), and I'd guess this falls into that category based on the richness of the cool colors, particularly the deep blues and purples."}, "mixed": {"title": "The Battle of Britain Memorial Window", "caption": "This is a fairly modern (1947) installment in the [RAF Chapel](https://www.westminster-abbey.org/history/explore-our-history/raf-chapel) of Westminster Abbey. Something I found interesting in the UK was that stained glass memorializing those lost in battle, particularly in the World Wars, were fairly common (both in Scotland and England); I had previously only seen religious imagery depicted on holy grounds."}, "renala": {"title": "Sir Charles and Sir John Wolfe Barry", "caption": "There's something odd about seeing a king and a civil engineer enshrined in the [nave](https://www.westminster-abbey.org/abbey-commemorations/commemorations/sir-charles-and-sir-john-wolfe-barry) of Westminster Abbey. Sir John Wolfe Barry designed multiple prominent bridges in the London area, including Blackfriars Bridge."}, "strategem": {"title": "Major-General Andrew Gilbert Wauchope", "caption": "Taken at St Giles' Cathedral in Edinburgh, in memory of a major-general who died in the Battle of Magersfontein in the Second Boer War. One of the more interesting pieces of Scottish history I learned while in Edinburgh is that much of England's military victories were paid for in Scottish blood. Its strange to see a monument to such an unjust conflict in a place like this."}, "zealot": {"title": "Guardian of Scotland", "caption": "This glass is from the oldest building on the Castle Edinburgh grounds: [St Margaret's Chapel](https://www.edinburghcastle.scot/see-and-do/highlights/st-margarets-chapel/). It depicts Sir William Wallace, one of the main leaders during the First War of Scottish Independence.", "favorite": true}}, "kirk": {"1": {"title": "James Harlay Monument", "caption": "This one was tough to trace down, but it appears to be the grave of [James Harlay](https://fogk.org/2025/08/10/the-east-wall/). I can't find much about him, other than that he was \"Keeper of His Majesties Privy Seal\", which sounds... nevermind."}, "2": {"title": "Borthwick Monument", "caption": "The most striking thing to me about the monuments and murals in Greyfriars Kirkyard was that so few seemed to depict religious imagery, instead showing memento mori symbols. Supposedly there are potentially hundreds or thousands of bodies on the grounds despite there being only 750 grave markers; so it makes sense that this would have started to feel like a Godless place at some point. This particular mural was in memory of James Borthwick, a famed surgeon, hence the depiction of various surgical instruments."}, "booba": {"title": "Displaced Finial", "caption": "I believe this is a stone finial that would normally be atop some sort of gate or decorative pillar, but has broken off. The design may be of an acorn, which is representative of the cycle of rebirth."}, "ded": {"title": "Momento Mori Stone", "caption": "This headstone was off to the side, with no notable accompanying plaque or text. Since the kirkyard is thought to contain tens to hundreds of thousands of bodies, I took this as a marker to the less distinguished residents."}, "grave": {"title": "George Heriot Monument", "caption": "Although it can't really be deciphered now, the [inscription once read](https://www.findagrave.com/memorial/85276703/george-heriot):\n\nPassenger, who art wise, hence know whence you are,\nwhat you are, and what you are to be,\nLife, gate of death; Death, gate of life to me,\nSole death of death gives life eternally.\nTherefore, whoever breathe draws from the air,\nWhile live thou may'st, thyself for death prepare."}, "headless": {"title": "This I'll Defend", "caption": "This is the heraldic coat of arms of [Clan Macfarlane](https://en.wikipedia.org/wiki/Clan_MacFarlane), whose motto was \"this I'll defend\". The banner paired with the coat of arms' headless guardians is quite a statement on the inevitability of death and the futility of earthly squabbles."}, "heads": {"title": "John Mylne III Memorial", "caption": "It took some digging, but I believe this is the grave of [John Mylne III](https://www.findagrave.com/memorial/75232661/john-mylne), Master Mason to the Crown of Scotland. I also believe these faces are some variation of [Green Men](https://en.wikipedia.org/wiki/Green_Man), foliaged figures meant to represent rebirth. Their somewhat grotesque appearance is likely also to ward off evil spirits from the burial grounds."}, "hut": {"title": "St. George's Well", "caption": "It's a shame to see something nearly as old as the United States vandalized, but the water from this well's spring is [notoriously foul tasting](https://www.megalithic.co.uk/article.php?sid=15325), so I guess its fitting that the exterior has been made to match."}, "spooy": {"title": "The Foulis Memorial", "caption": "A [monument](https://fogk.org/2025/07/11/the-foulis-memorial/) to the Laird of Ravelston and his wife, constructed by his son George Foulis of Ravelston."}}, "nature": {"bee": {"title": "Cardoon", "caption": "A bee visiting a cardoon ([cynara cardunculus](https://data.rbge.org.uk/search/livingcollection/?eti=Cynara+cardunculus&cfg=livcol.cfg&acc_num=&acc_num_qual=&barcode=))."}, "bench": {"title": "Bench", "caption": "A bench along the Water of Leith Walkway."}, "bird": {"title": "Arthur's Roost", "caption": "A bird seen near the ruins of St Anthony's Chapel on the way to the top of Arthur's Seat."}, "buttercup": {"title": "St. John's Wort", "caption": "At least I'm pretty sure this is some variant of St. John's Wart ([hypericum 'hidcote'](https://data.rbge.org.uk/search/livingcollection/?eti=Hypericum&cfg=livcol.cfg&acc_num=&acc_num_qual=&barcode=)). Its a surprisingly hardy plant, and depending on where it grows it has slightly different characteristics. The petals of these flowers are fairly broad, for example."}, "fairies": {"title": "Mystic Water", "caption": "A water feature at the Royal Botanic Garden in Edinburgh."}, "lily": {"title": "Water Lily", "caption": "A lone water lily in one of the ponds at the Royal Botanic Garden in Edinburgh.", "favorite": true}, "pinky": {"title": "Codlins & Cream", "caption": "Otherwise known as great willowherb ([epilobium hirsutum](https://data.rbge.org.uk/search/livingcollection/?eti=Epilobium+hirsutum&cfg=livcol.cfg&acc_num=&acc_num_qual=&barcode=)), but who'd use that name when \"codlins and cream\" is an option."}, "yellowflowers": {"title": "Ragwort", "caption": "This is some kind of ragwort, which are members of the Daisy family. Possibly redstem ragwort ([senecio achilleifolius](https://data.rbge.org.uk/search/livingcollection/?eti=Senecio&cfg=livcol.cfg&acc_num=&acc_num_qual=&barcode=))? Its tough to tell."}}}</script>

    if (fig) { e.preventDefault(); open(fig); }
  });

  card.addEventListener('click', function (e) {
    // A caption link is a click on the card too -- let it navigate without
    // also flipping the card out from under the reader.
    if (e.target.closest('a')) return;
    card.classList.toggle('is-flipped');
  });
  closer.addEventListener('click', function (e) { e.stopPropagation(); close(); });
  box.addEventListener('click', function (e) {
    if (e.target === box || e.target === veil) close();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !box.hidden) close();
  });
}());
</script>
</body>
</html>

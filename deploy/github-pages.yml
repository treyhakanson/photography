# Build the gallery and publish it to GitHub Pages.
#
# Not active yet -- copy this to .github/workflows/deploy.yml in the repo root
# when you are ready to publish. It is kept here so pushing during review does
# not deploy anything.
#
# Repo settings -> Pages -> Source: "GitHub Actions".
#
# Serving at treyhakanson.github.io/photography needs the repo to be named
# `photography`; the base path in site.config.json must match the repo name.
name: Deploy gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Photos are committed with Git LFS? They must NOT be -- Pages serves
          # LFS pointer files as-is. Keep them as ordinary blobs.
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
